[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { name = "NOVA contributors" } ]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "NOVA (Notation for Objects, Values & Agents) grammar for tree-sitter"
keywords = [ "incremental", "parsing", "tree-sitter", "nova" ]
license.text = "Apache-2.0"
name = "tree-sitter-nova"
readme = "README.md"
requires-python = ">=3.10"
version = "0.2.0"

[project.urls]
Homepage = "https://github.com/novafile/tree-sitter-nova"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
