[package]
authors = [ "NOVA contributors" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "NOVA (Notation for Objects, Values & Agents) grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "nova" ]
license = "Apache-2.0"
name = "tree-sitter-nova"
readme = "README.md"
repository = "https://github.com/novafile/tree-sitter-nova"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.2"
