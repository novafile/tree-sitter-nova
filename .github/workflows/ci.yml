name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Generate and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check that the generated parser is up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/

      - name: Corpus and highlight tests
        run: npx tree-sitter test

      - name: Parse sample files without errors
        shell: bash
        run: npx tree-sitter parse --quiet --stat test/highlight/*.nova

  bindings:
    name: Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Rust
        run: cargo test

      - name: Node
        run: |
          npm ci
          npm test

      - name: Python
        run: |
          python -m pip install tree-sitter .
          python -m unittest discover -s bindings/python/tests

      - name: Go
        run: go test ./bindings/go/

      - name: C
        run: make
