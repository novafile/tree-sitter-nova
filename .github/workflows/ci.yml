name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Generate and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # Node 25+ no longer bundles corepack; it provides the Yarn version
      # pinned in package.json (packageManager).
      - name: Enable corepack
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Two grammars: `nova` (grammar.js, src/) and `nova_schema`
      # (schema/grammar.js, schema/src/); both use common/flow.js.
      - name: Check that the generated parsers are up to date
        if: runner.os == 'Linux'
        shell: bash
        run: |
          yarn tree-sitter generate
          (cd schema && yarn tree-sitter generate)
          git diff --exit-code -- src/ schema/src/

      # The highlight tests of both grammars live in test/highlight; the
      # file type (.nova / .novs) selects the grammar.
      - name: Corpus and highlight tests (nova)
        run: yarn tree-sitter test

      - name: Corpus tests (nova_schema)
        run: yarn tree-sitter test -p schema

      - name: Parse sample files without errors
        shell: bash
        run: yarn tree-sitter parse --quiet --stat test/highlight/*.nova test/highlight/*.novs

      # Random edits must reparse incrementally to the same tree, which
      # checks the scanners' state serialization. `tree-sitter fuzz` exits
      # with 0 even when a case fails, so look at its output.
      - name: Fuzz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          yarn tree-sitter fuzz --iterations 20 --edits 5 | tee fuzz.log
          (cd schema && yarn tree-sitter fuzz --iterations 20 --edits 5) | tee -a fuzz.log
          ! grep -E 'Incorrect parse|failed fuzzing' fuzz.log

  bindings:
    name: Bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      # Node 25+ no longer bundles corepack; it provides the Yarn version
      # pinned in package.json (packageManager).
      - name: Enable corepack
        run: |
          npm install -g corepack
          corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Rust
        run: cargo test

      - name: Node
        run: |
          yarn install --immutable
          yarn test

      - name: Python
        run: |
          python -m pip install tree-sitter .
          python -m unittest discover -s bindings/python/tests

      - name: Go
        run: go test ./bindings/go/

      - name: C
        run: make
